<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pramaanik — Sign Up</title>
  <link rel="stylesheet" href="/signup.css">
</head>
<body>
  <div id="signupPageWrapper">
    <div id="loginContainer" class="signup-container">
      <button class="toggle-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">🌙</button>

      <div class="login-brand">
        <div class="login-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h2>Create Account</h2>
        <p>Sign up using the details from the user schema</p>
      </div>

      <form id="signupForm" novalidate>
        <div class="signup-grid">
          <div class="input-group">
            <label for="firstnameInput">First name</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" id="firstnameInput" placeholder="Rahul" required autocomplete="given-name">
            </div>
          </div>

          <div class="input-group">
            <label for="lastnameInput">Last name</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" id="lastnameInput" placeholder="Sharma" required autocomplete="family-name">
            </div>
          </div>
        </div>

        <div class="input-group">
          <label for="emailInput">Email</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input type="email" id="emailInput" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="signup-grid">
          <div class="input-group">
            <label for="passwordInput">Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="passwordInput" placeholder="Create a password" required autocomplete="new-password">
            </div>
          </div>

          <div class="input-group">
            <label for="contactInput">Contact</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.61a2 2 0 0 1-.45 2.11L8 9.68a16 16 0 0 0 6.32 6.32l1.24-1.24a2 2 0 0 1 2.11-.45c.84.3 1.71.51 2.61.63A2 2 0 0 1 22 16.92z"/>
                </svg>
              </span>
              <input type="text" id="contactInput" placeholder="Mobile number or email" required autocomplete="tel">
            </div>
          </div>
        </div>

        <div class="signup-grid">
          <div class="input-group">
            <label for="genderInput">Gender</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="7" r="4"/>
                  <path d="M5.5 21a8.5 8.5 0 0 1 13 0"/>
                </svg>
              </span>
              <select id="genderInput" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <label for="ageInput">Age</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 8v4l3 3"/>
                  <circle cx="12" cy="12" r="10"/>
                </svg>
              </span>
              <input type="number" id="ageInput" placeholder="18" min="1" max="120" required autocomplete="bday">
            </div>
          </div>
        </div>

        <button type="submit" class="btn" id="signupSubmitBtn">Create account</button>
      </form>

      <p class="signup" style="margin-top:0.5rem;">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="/signup.js"></script>
</body>
</html>
